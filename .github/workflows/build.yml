name: "Godot 4.3 CI Build & Release"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Build & Package Godot 4.3 Binaries
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Determine Version
        shell: bash
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            VERSION="${REF#refs/tags/}"
          else
            VERSION="v1.7.1"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Target Release Version: $VERSION"

      - name: Setup Export Directory & Templates
        run: |
          mkdir -v -p build/windows
          mkdir -v -p build/linux
          mkdir -v -p /github/home/.local/share/godot/export_templates
          ln -s /root/.local/share/godot/export_templates/4.3.stable /github/home/.local/share/godot/export_templates/4.3.stable || cp -r /root/.local/share/godot/export_templates/4.3.stable /github/home/.local/share/godot/export_templates/
          ls -la /github/home/.local/share/godot/export_templates/4.3.stable/

      - name: Export Windows Executable
        run: |
          godot --headless --verbose --export-release "Windows Desktop" "build/windows/RACING-${{ env.VERSION }}.exe"

      - name: Export Linux Binary
        run: |
          godot --headless --verbose --export-release "Linux/X11" "build/linux/RACING-${{ env.VERSION }}.x86_64"

      - name: Compress Release Packages
        run: |
          cd build/windows && zip -r "../../RACING-${{ env.VERSION }}-Windows-x86_64.zip" . && cd ../..
          cd build/linux && zip -r "../../RACING-${{ env.VERSION }}-Linux-x86_64.zip" . && cd ../..

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RACING-${{ env.VERSION }}-Windows-x86_64
          path: RACING-${{ env.VERSION }}-Windows-x86_64.zip

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RACING-${{ env.VERSION }}-Linux-x86_64
          path: RACING-${{ env.VERSION }}-Linux-x86_64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RACING-${{ env.VERSION }}-Windows-x86_64.zip
            RACING-${{ env.VERSION }}-Linux-x86_64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
