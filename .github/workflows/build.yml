name: "Godot 4.3 CI Build & Release"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPORT_NAME: RACING

jobs:
  export:
    name: Build & Package Godot 4.3 Binaries
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Export Directory
        run: |
          mkdir -v -p build/windows
          mkdir -v -p build/linux

      - name: Export Windows Executable
        run: |
          godot --headless --verbose --export-release "Windows Desktop" build/windows/$EXPORT_NAME.exe

      - name: Export Linux Binary
        run: |
          godot --headless --verbose --export-release "Linux/X11" build/linux/$EXPORT_NAME.x86_64

      - name: Compress Release Packages
        run: |
          cd build/windows && zip -r ../../RACING-Windows-x86_64.zip . && cd ../..
          cd build/linux && zip -r ../../RACING-Linux-x86_64.zip . && cd ../..

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RACING-Windows-x86_64
          path: RACING-Windows-x86_64.zip

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RACING-Linux-x86_64
          path: RACING-Linux-x86_64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RACING-Windows-x86_64.zip
            RACING-Linux-x86_64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
